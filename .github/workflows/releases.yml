name: Publish version release

on:
  push:
    tags: ['magenta-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (magenta-vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: version-releases
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Select version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$REQUESTED_TAG" =~ ^magenta-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0
      - name: Assemble release assets
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          test -s "releases/$TAG.md"
          mkdir -p release-assets
          cp Images/magenta.iso Images/avalanche.iso Images/magenta-data.img Images/avalanche-data.img release-assets/
          cp avalanche/images/avalanche.elf release-assets/
          cp Images/glossy-desktop.png release-assets/magenta-desktop.png
          cp Images/glossy-launcher.png release-assets/magenta-launcher.png
          cp Images/glossy-files.png release-assets/magenta-files.png
          git archive --format=zip --prefix=magenta/ --output=release-assets/magenta-source.zip "$TAG"
          cd release-assets
          sha256sum * > SHA256SUMS
      - name: Remove previous releases for the release policy transition
        if: steps.version.outputs.tag == 'magenta-v0.2.0'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            for (const release of releases) {
              if (release.tag_name === 'magenta-v0.2.0') continue;
              await github.rest.repos.deleteRelease({owner, repo, release_id: release.id});
            }
      - name: Publish release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Magenta ${TAG#magenta-v} — Mountains" --notes-file "releases/$TAG.md" --latest
          else
            gh release create "$TAG" --verify-tag --title "Magenta ${TAG#magenta-v} — Mountains" --notes-file "releases/$TAG.md" --latest
          fi
          gh release upload "$TAG" release-assets/* --clobber

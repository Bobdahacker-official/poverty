name: Update published release notes
on:
  push:
    branches: [main]
    paths: ['releases/*.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {owner, repo} = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            for (const release of releases) {
              if (!/^magenta-v\d+\.\d+\.\d+$/.test(release.tag_name)) continue;
              const path = `releases/${release.tag_name}.md`;
              if (!fs.existsSync(path)) continue;
              const body = fs.readFileSync(path, 'utf8');
              const name = body.split('\n')[0].replace(/^# /, '');
              await github.rest.repos.updateRelease({owner, repo, release_id: release.id, name, body});
            }
      - name: Remove screenshot downloads and update checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=magenta-v0.2.0
          gh release view "$tag" --json assets --jq '.assets[] | select(.name | endswith(".png")) | .name' > /tmp/release-pngs
          while IFS= read -r asset; do
            gh release delete-asset "$tag" "$asset" --yes
          done < /tmp/release-pngs
          mkdir -p /tmp/release-checksums
          gh release download "$tag" --pattern SHA256SUMS --dir /tmp/release-checksums --clobber
          sed -i '/\.png$/d' /tmp/release-checksums/SHA256SUMS
          gh release upload "$tag" /tmp/release-checksums/SHA256SUMS --clobber

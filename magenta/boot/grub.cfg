set gfxmode=1280x720,1280x800,1024x768,800x600,640x480,auto
set timeout=3
set default=0
if smbios --type 1 --get-string 5 --set=system_product; then
    if [ "$system_product" = "VirtualBox" ]; then
        set default=1
    fi
fi
menuentry "Magenta x86-64 (widescreen)" {
    multiboot2 /boot/avalanche.elf --magenta
    set gfxpayload=$gfxmode
    boot
}
menuentry "Magenta x86-64 (compact window)" {
    multiboot2 /boot/avalanche.elf --magenta
    set gfxpayload=640x480x32,640x480,800x600,auto
    boot
}
menuentry "Magenta - Avalanche rescue console" {
    multiboot2 /boot/avalanche.elf
    set gfxpayload=$gfxmode
    boot
}
